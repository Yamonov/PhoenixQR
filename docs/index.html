<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoenixQR</title>
    <script type="module" crossorigin src="./assets/index-vusqo_FO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Do3wU5EL.css">
  </head>
  <body>
    <main id="app" class="shell">
      <section class="topbar" aria-label="Application header">
        <div class="brand-line">
          <h1>PhoenixQR</h1>
          <p>セル構成の全く同じQRコードを生成</p>
        </div>
      </section>

      <section class="workspace" aria-label="QR analysis workspace">
        <aside class="control-panel">
          <label class="drop-zone is-empty" id="dropZone">
            <input id="fileInput" type="file" accept="image/png,image/jpeg" />
            <canvas id="sourceCanvas" width="304" height="304"></canvas>
            <span class="drop-placeholder" id="sourcePlaceholder">PNG/JPEGをドロップ</span>
          </label>

          <div class="message" id="message" role="status">画像を選択してください。</div>

          <dl class="meta-list" id="metaList">
            <div>
              <dt>Content</dt>
              <dd id="metaContent">-</dd>
            </div>
            <div>
              <dt>Version</dt>
              <dd id="metaVersion">-</dd>
            </div>
            <div>
              <dt>Cells</dt>
              <dd id="metaCells">-</dd>
            </div>
            <div>
              <dt>Error correction</dt>
              <dd id="metaEcl">-</dd>
            </div>
            <div>
              <dt>Mask</dt>
              <dd id="metaMask">-</dd>
            </div>
            <div>
              <dt>Contrast</dt>
              <dd id="metaContrast">-</dd>
            </div>
            <div>
              <dt>Ambiguous cells</dt>
              <dd id="metaAmbiguous">-</dd>
            </div>
            <div>
              <dt>jsQR decode</dt>
              <dd id="metaReadCheck">-</dd>
            </div>
            <div>
              <dt>Decode note</dt>
              <dd id="metaReadDifference">-</dd>
            </div>
          </dl>

        </aside>

        <section class="preview-grid">
          <article class="preview-card comparison-card">
            <header>
              <h2>セルをクリックやドラッグで修正できます</h2>
              <div class="overlay-control">
                <label for="overlayOpacity">不透明度：</label>
                <input id="overlayOpacity" type="range" min="10" max="100" step="5" value="50" />
                <output id="overlayOpacityValue" for="overlayOpacity">50%</output>
                <button id="overlayToggle" class="overlay-toggle" type="button" aria-pressed="true" aria-label="オーバーレイを非表示にする" title="オーバーレイの表示切替">●</button>
              </div>
            </header>
            <canvas id="warpedCanvas"></canvas>
          </article>

          <article class="preview-card export-card">
            <header>
              <h2>修正したQRを書き出し</h2>
            </header>
            <div class="export-panel">
              <button id="downloadPngDtp" type="button" disabled>
                <span class="button-main">PNG</span>
                <span class="button-sub">DTP向け1セル1pxグレースケール</span>
              </button>
              <button id="downloadPngOffice" type="button" disabled>
                <span class="button-main">PNG</span>
                <span class="button-sub">Photoshop/Office等向け1セル20px</span>
              </button>
              <button id="downloadSvg" type="button" disabled>
                <span class="button-main">SVG</span>
              </button>
              <button id="downloadEps" type="button" disabled>
                <span class="button-main">EPS</span>
                <span class="button-sub">２値</span>
              </button>
            </div>
          </article>

          <span id="matrixSize" class="visually-hidden">-</span>
          <canvas id="matrixCanvas" class="hidden-canvas" aria-hidden="true"></canvas>
        </section>
      </section>

      <footer class="site-footer">
        <a href="https://github.com/Yamonov/PhoenixQR" target="_blank" rel="noreferrer">GitHub</a>
        <span id="libraryStatus">jsQR ready</span>
        <span>QRコードは株式会社デンソーウェーブの登録商標です</span>
      </footer>
    </main>
  </body>
</html>
